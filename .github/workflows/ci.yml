name: Build and Test JSeed

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build and run unit and integration tests
        run: mvn --batch-mode --no-transfer-progress -Pintegration verify

      - name: Upload example JAR
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: jseed-example
          path: |
            jseed-starter-example/target/jseed-starter-example-*.jar
            !jseed-starter-example/target/*-sources.jar
            !jseed-starter-example/target/*-javadoc.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Maven test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
